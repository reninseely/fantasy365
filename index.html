<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy 365 — Draft Room</title>
<style>
  :root{
    --felt:#0b2b22;
    --felt-light:#123a2c;
    --shell:#12181a;
    --shell-2:#1a2124;
    --line:#2a3336;
    --paper:#e9e4d8;
    --paper-dim:#a9b0ac;
    --amber:#e0a530;
    --amber-dim:#8a6c2e;
    --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--shell); color:var(--paper); font-family:var(--sans); min-height:100vh;}
  .wrap{max-width:1560px; margin:0 auto; padding:20px 20px 60px;}
  .topbar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px; gap:14px;}
  .topbar-left{justify-self:start;}
  .topbar-center{justify-self:center;}
  .topbar-right{justify-self:end; display:flex; align-items:center; gap:14px;}
  .brand-logo{height:56px; display:block;}
  h1{font-size:11px; margin:6px 0 0; font-weight:500; color:var(--paper-dim); letter-spacing:0.02em;}
  .who{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--paper-dim);}
  .admin-footer{margin-top:32px; padding-top:16px; border-top:1px solid var(--line); display:flex; justify-content:center; opacity:0.7;}
  .admin-footer:hover{opacity:1;}
  .who .locked{font-family:var(--mono); color:var(--amber); font-weight:600;}
  .admin-badge{font-family:var(--mono); font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; background:rgba(224,165,48,0.15); color:var(--amber); border:1px solid var(--amber-dim); border-radius:4px; padding:2px 7px;}
  select, button, input, textarea{font-family:var(--sans); font-size:14px; background:var(--shell-2); color:var(--paper); border:1px solid var(--line); border-radius:6px; padding:7px 10px;}
  button{cursor:pointer; transition:background .15s, border-color .15s;}
  button:hover{border-color:var(--amber-dim);}
  button.primary{background:var(--amber); color:#1a1204; border-color:var(--amber); font-weight:600;}
  button.primary:hover{background:#eab648;}
  button.ghost{background:transparent;}
  button:disabled{opacity:.4; cursor:not-allowed;}
  .card{background:var(--shell-2); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px;}
  .gate-card{max-width:420px; margin:60px auto; text-align:center; padding:28px 24px;}
  .gate-card .row{justify-content:center;}
  .card h2{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--paper-dim); margin:0 0 12px; font-weight:600; flex-shrink:0;}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .owner-list{display:flex; flex-direction:column; gap:8px;}
  .owner-row{display:flex; gap:8px; align-items:center;}
  .owner-row input{flex:1;}
  .field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--paper-dim);}
  .clock-panel{background:var(--felt); border:1px solid #1f4536; border-radius:10px; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:16px;}
  .clock-panel .onclock{font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8fbfa5;}
  .clock-panel .ownername{font-size:26px; font-weight:700; margin-top:2px;}
  .clock-panel .pickmeta{font-family:var(--mono); font-size:12px; color:#8fbfa5; margin-top:4px;}
  .onclock-inline{display:flex; align-items:center; gap:8px; background:rgba(224,165,48,0.10); border:1px solid var(--amber-dim); border-radius:7px; padding:5px 14px; justify-content:center;}
  .onclock-inline .oc-label{font-size:9px; letter-spacing:0.1em; text-transform:uppercase; color:var(--amber-dim);}
  .onclock-inline .oc-name{font-size:14px; font-weight:700; color:var(--amber); line-height:1.1;}
  .onclock-inline .oc-meta{font-size:10px; font-family:var(--mono); color:var(--amber-dim); border-left:1px solid var(--amber-dim); padding-left:10px;}
  .board{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
  table{border-collapse:collapse; width:100%; font-size:13px; table-layout:fixed;}
  th, td{border:1px solid var(--line); padding:8px 10px; text-align:left; white-space:normal; overflow-wrap:break-word; vertical-align:top;}
  th{background:var(--shell); position:sticky; top:0; font-family:var(--mono); font-weight:600; color:var(--paper-dim);}
  td.rd{font-family:var(--mono); color:var(--paper-dim); background:var(--shell); text-align:center; vertical-align:middle;}
  td.filled{background:#152018; font-weight:600; color:var(--paper);}
  td.onclock-cell{outline:1px solid var(--amber); background:rgba(224,165,48,0.08);}
  th:first-child, td.rd{width:44px;}
  .board-sub{font-size:10.5px; font-weight:400; color:var(--paper-dim); margin-top:2px; line-height:1.3;}
  .pool-search{width:100%; margin-bottom:8px; flex-shrink:0;}
  .pool-sort{display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-shrink:0;}
  .filter-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--paper-dim);}
  .pool-item-stats{font-family:var(--mono); font-size:11.5px; color:var(--paper-dim); white-space:nowrap; flex-shrink:0;}
  .pool-item-stats b{color:var(--paper); font-weight:600;}
  .pool-list{flex:1; min-height:200px; overflow-y:auto; border:1px solid var(--line); border-radius:8px;}
  .pool-item{border-bottom:1px solid var(--line); font-size:13px;}
  .pool-item-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 10px;}
  .pool-item-info{display:flex; align-items:center; gap:8px; cursor:pointer; flex:1; min-width:0;}
  .expand-arrow{color:var(--paper-dim); font-size:10px; width:10px; flex-shrink:0;}
  .pool-item-detail{margin:2px 10px 10px 32px; padding:9px 12px; background:var(--shell); border:1px solid var(--line); border-radius:6px; display:flex; flex-direction:column; gap:6px;}
  .detail-row{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .detail-label{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--paper-dim);}
  .detail-value{font-family:var(--mono); font-size:14px; font-weight:600; color:var(--paper);}
  .pool-item:last-child{border-bottom:none;}
  .pool-item .meta{color:var(--paper-dim); font-size:11.5px; font-family:var(--mono);}
  .pool-item button{padding:5px 10px; font-size:12px;}
  .tag{font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; background:var(--felt-light); color:#8fbfa5; border-radius:4px; padding:2px 6px;}
  textarea{width:100%; min-height:90px; font-family:var(--mono); font-size:12px;}
  .hint{font-size:12px; color:var(--paper-dim); line-height:1.5;}
  .log{max-height:180px; overflow-y:auto; font-family:var(--mono); font-size:12px; color:var(--paper-dim);}
  .log div{padding:3px 0; border-bottom:1px solid var(--line);}
  .empty{padding:24px; text-align:center; color:var(--paper-dim); font-size:13px;}
  .flexwrap{display:flex; flex-wrap:wrap; gap:16px;}
  .col{flex:1; min-width:300px;}
  .col .card{display:flex; flex-direction:column; width:100%;}
  .col.roster-col{flex:2; min-width:560px;}
  .roster-columns{display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px;}
  .roster-columns h3{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber-dim); margin:0 0 8px; font-weight:600; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .slot-group{margin-bottom:12px;}
  .slot-group-title{font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:var(--paper-dim); margin-bottom:5px; opacity:0.75;}
  .slot-row{display:flex; justify-content:space-between; gap:6px; font-size:12.5px; padding:5px 7px; border-radius:5px; border:1px solid var(--line); border-left-width:3px; margin-bottom:4px;}
  .slot-row .label{color:var(--paper-dim); font-family:var(--mono); font-size:10.5px; min-width:56px;}
  .slot-row span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right;}
  .slot-row.open{border-style:dashed; color:var(--paper-dim);}
  .extra-list{font-size:12.5px; color:var(--paper-dim); margin-top:4px;}
  .claim-note{font-size:11px; color:var(--paper-dim); margin-top:4px;}
  .dot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:7px; vertical-align:middle; flex-shrink:0;}
  .teamtag{font-family:var(--mono); font-size:10.5px; color:var(--paper-dim); margin-left:5px;}
  #toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1a2124; border:1px solid var(--line); color:var(--paper); padding:10px 18px; border-radius:8px; font-size:13px; box-shadow:0 6px 24px rgba(0,0,0,0.45); z-index:1000; display:none; max-width:90vw; text-align:center;}
  #toast.show{display:block;}
  #toast.error{border-color:#c25b4a; color:#f3b3a6;}
</style>
</head>

// ---------- Firebase Realtime Database polyfill for window.storage ----------
// This replaces Claude's built-in artifact storage (which requires viewers to have a Claude account)
// with a free Firebase Realtime Database, so anyone with the link can use this with zero account/login.
// Matches window.storage's exact get(key,shared)/set(key,value,shared) contract, so nothing else in
// this file needed to change -- every existing call site below works unchanged against this instead.
const FIREBASE_DB_URL = "https://fantasy365-6f7a0-default-rtdb.firebaseio.com";

function fbBrowserId(){
  let id = localStorage.getItem("f365_browser_id");
  if(!id){
    id = "b_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2);
    localStorage.setItem("f365_browser_id", id);
  }
  return id;
}
function fbPath(key, shared){
  const scope = shared ? "shared" : ("personal_" + fbBrowserId());
  return `${scope}/${encodeURIComponent(key)}`;
}

window.storage = {
  async get(key, shared){
    const path = fbPath(key, shared);
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`);
    if(!res.ok) throw new Error("Firebase read failed ("+res.status+")");
    const value = await res.json();
    if(value === null) throw new Error("Key not found: "+key); // matches window.storage's throw-on-missing contract
    return {key, value, shared: !!shared};
  },
  async set(key, value, shared){
    const path = fbPath(key, shared);
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(value)
    });
    if(!res.ok) throw new Error("Firebase write failed ("+res.status+")");
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    const path = fbPath(key, shared);
    const res = await fetch(`${FIREBASE_DB_URL}/${path}.json`, {method: "DELETE"});
    if(!res.ok) throw new Error("Firebase delete failed ("+res.status+")");
    return {key, deleted: true, shared: !!shared};
  },
  async list(prefix, shared){
    throw new Error("list() is not used by this app and isn't implemented in the Firebase polyfill.");
  }
};

// One color per league — used everywhere an asset shows up (pool, roster, board) so a sport
// reads the same color no matter whether it's a team or a player. Deliberately avoids
// amber/gold since that's reserved for the "on the clock" / brand accent.
const LEAGUE_COLORS = {
  NFL: "#2f6fb3",
  NBA: "#e67e22",
  MLB: "#e74c3c",
  NHL: "#1abc9c",
  NCAAF: "#9b59b6",
  NCAAB: "#a1663e",
  MLS: "#e84393",
  EPL: "#33a852",
  GOLF: "#e3d9fb",
  TENNIS: "#c6e63e"
};
function leagueOf(category){
  if(!category) return null;
  const key = category.split("_")[0];
  return LEAGUE_COLORS[key] ? key : null;
}
function leagueColor(category){
  const lg = leagueOf(category);
  return lg ? LEAGUE_COLORS[lg] : "#888888";
}
function leagueDot(category){
  return `<span class="dot" style="background:${leagueColor(category)}"></span>`;
}
function prettyCategory(category){
  return category ? category.replace(/_/g, " ") : category;
}
function nameWithTeam(name, teamAbrv){
  return teamAbrv ? `${name} <span class="teamtag">${teamAbrv}</span>` : name;
}
function fmtStat(v){
  if(v === null || v === undefined) return null;
  return Number.isInteger(v) ? String(v) : v.toFixed(3);
}
function poolStatLine(a){
  const parts = [];
  if(a.rank !== null && a.rank !== undefined) parts.push("Rank "+a.rank);
  if(a.projectedPoints !== null && a.projectedPoints !== undefined) parts.push("Proj "+fmtStat(a.projectedPoints));
  if(a.lastSeasonPoints !== null && a.lastSeasonPoints !== undefined) parts.push("Last yr "+fmtStat(a.lastSeasonPoints));
  return parts.length ? " · "+parts.join(" · ") : "";
}

// Minimal CSV parser: handles a header row, quoted fields (with embedded commas/quotes), and blank cells.
function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  const pushField = ()=>{ row.push(field); field = ""; };
  const pushRow = ()=>{ pushField(); rows.push(row); row = []; };
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else { field += ch; }
    } else {
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ pushField(); }
      else if(ch === '\n'){ pushRow(); }
      else if(ch === '\r'){ /* skip */ }
      else { field += ch; }
    }
  }
  if(field.length || row.length){ pushRow(); }
  const filtered = rows.filter(r => r.some(c => c.trim() !== ""));
  if(filtered.length < 2) return [];
  const headers = filtered[0].map(h => h.trim());
  return filtered.slice(1).map(r=>{
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = (r[i] !== undefined ? r[i].trim() : ""); });
    return obj;
  });
}

function csvRowsToPool(rows){
  const mapped = rows.filter(r => r.id && r.name).map(r=>{
    const num = v => (v !== undefined && v !== "" && !isNaN(Number(v))) ? Number(v) : null;
    return {
      id: r.id,
      name: r.name,
      type: r.type,
      category: r.category,
      team: r.team || null,
      teamAbrv: r.team_abrv || null,
      rank: num(r.position_rank),
      positionRank: num(r.position_rank),
      adp: num(r.adp !== undefined ? r.adp : r.overall_rank), // "adp" column preferred; falls back to "overall_rank" for older sheets
      overallRank: num(r.adp !== undefined ? r.adp : r.overall_rank),
      projectedPoints: num(r.projected_points),
      lastSeasonPoints: num(r.last_season_points)
    };
  });

  // De-duplicate ids: two different real assets (e.g. two players with the same name on different
  // teams) can end up with the same auto-generated id. A shared id breaks drafting — the second one
  // becomes an unreachable "already taken" ghost — so rename any collision to stay unique.
  const seen = new Set();
  let renamed = 0;
  mapped.forEach(a=>{
    if(!seen.has(a.id)){ seen.add(a.id); return; }
    let candidate = a.teamAbrv ? `${a.id}_${a.teamAbrv.toLowerCase()}` : null;
    let n = 2;
    while(!candidate || seen.has(candidate)){ candidate = `${a.id}_${n}`; n++; }
    a.id = candidate;
    seen.add(candidate);
    renamed++;
  });
  csvRowsToPool.lastDedupeCount = renamed;

  return mapped;
}

function showToast(msg, isError){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.className = "show" + (isError ? " error" : "");
  if(toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(()=>{ t.className = ""; }, 4500);
}

async function loadState(){
  try{ const res = await window.storage.get(SETUP_KEY, true); return res ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function saveState(newState){
  const json = JSON.stringify(newState);
  await window.storage.set(SETUP_KEY, json, true);
  state = newState;
  lastStateJSON = json; // so the next poll doesn't treat our own change as "new" and re-render redundantly
}
async function loadIdentity(){
  try{ const res = await window.storage.get(IDENTITY_KEY, false); return res ? JSON.parse(res.value) : null; }
  catch(e){ return null; }
}
async function saveIdentity(obj){
  await window.storage.set(IDENTITY_KEY, JSON.stringify(obj), false);
  myIdentity = obj;
}
async function loadAdminMode(){
  try{ const res = await window.storage.get(ADMIN_MODE_KEY, false); return res ? res.value === "true" : false; }
  catch(e){ return false; }
}
async function saveAdminMode(v){
  await window.storage.set(ADMIN_MODE_KEY, String(v), false);
  adminModeActive = v;
}

function snakeOrder(ownerIds, rounds){
  const order = [];
  for(let r=0;r<rounds;r++){
    const rowOrder = (r % 2 === 0) ? ownerIds.slice() : ownerIds.slice().reverse();
    rowOrder.forEach(o => order.push({round:r+1, ownerId:o}));
  }
  return order;
}
function fmtClock(ms){
  if(ms < 0) ms = 0;
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  if(h > 0) return h+"h "+String(m).padStart(2,"0")+"m";
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function renderSetup(){

  const el = document.getElementById("setupArea");
  el.style.display = "block";
  el.innerHTML = `
    <div class="card">
      <h2>1 &middot; Owners</h2>

      <div class="row" style="margin-top:10px;"><button id="addOwnerBtn">+ Add owner</button></div>

      <div class="row">
        <div class="field"><label>Total rounds (picks per owner)</label><input type="number" id="rounds" value="35" min="1" style="width:90px;"></div>
      </div>
      <p class="hint">Snake order — turn order alternates direction each round. No time limit; whoever's on the clock picks whenever they're ready.</p>
    </div>
    <div class="card">

      For team assets, <code>category</code> must be one of: ${ROSTER_SPEC.teamSports.join(", ")}.<br>
      For player assets, <code>category</code> must be one of: ${ROSTER_SPEC.playerSlots.map(s=>s.key).join(", ")}, MLB_HITTER, MLB_PITCHER.<br>
      <code>MLB_FLEX</code> is reserved for true two-way players (e.g. Shohei Ohtani) — it can fill either an MLB hitter or pitcher slot. Everyone else in MLB should be MLB_HITTER or MLB_PITCHER.<br>
      Matching these exactly is what lets each owner's roster panel auto-slot picks into the right position — anything else still drafts fine, it just lands in that owner's "Extra" list instead of a labeled slot.</p>
      <div class="row" style="margin-bottom:10px;">
        <input type="file" id="poolCsvFile" accept=".csv,text/csv">
        <span id="csvStatus" class="hint"></span>
      </div>

  const ownerList = document.getElementById("ownerList");
  let owners = (state && state.ownerNames) ? state.ownerNames.slice() : ["Owner 1","Owner 2","Owner 3","Owner 4","Owner 5","Owner 6","Owner 7","Owner 8","Owner 9","Owner 10"];
  function drawOwners(){
    ownerList.innerHTML = "";
    owners.forEach((name, i) => {
      const row = document.createElement("div");
      row.className = "owner-row";
      row.innerHTML = `<input data-i="${i}" value="${name.replace(/"/g,'&quot;')}"><button data-remove="${i}">Remove</button>`;
      ownerList.appendChild(row);
    });

  drawOwners();
  ownerList.addEventListener("input", e=>{ if(e.target.dataset.i !== undefined) owners[+e.target.dataset.i] = e.target.value; });
  ownerList.addEventListener("click", e=>{
    if(e.target.dataset.remove !== undefined){ owners.splice(+e.target.dataset.remove,1); drawOwners(); }
  });
  document.getElementById("addOwnerBtn").onclick = ()=>{ owners.push("Owner "+(owners.length+1)); drawOwners(); };

  document.getElementById("poolCsvFile").onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById("csvStatus");
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const rows = parseCSV(reader.result);
        const parsedPool = csvRowsToPool(rows);
        if(parsedPool.length === 0){
          statusEl.textContent = "No usable rows found — check the id/name columns are filled in.";
          showToast("CSV parsed but found no usable rows.", true);
          return;
        }
        document.getElementById("poolInput").value = JSON.stringify(parsedPool);
        const dedupeNote = csvRowsToPool.lastDedupeCount ? ` (${csvRowsToPool.lastDedupeCount} duplicate id${csvRowsToPool.lastDedupeCount===1?"":"s"} auto-renamed)` : "";
        statusEl.textContent = `Loaded ${parsedPool.length} rows from ${file.name}.${dedupeNote}`;

    ownerIds.forEach(id => claims[id] = false);
    const newState = {
      draftId: Date.now().toString(36)+Math.random().toString(36).slice(2,8),
      ownerNames: owners, ownerIds: ownerIds,
      pool: pool.map(a=>({...a, drafted:false})),
      order: order, currentPick: 0,
      rosters: {}, log: [], claims: claims
    };
    ownerIds.forEach(id => newState.rosters[id] = []);
    await saveState(newState);
    render();
  };
}

// ---------- HELPERS ----------
function currentOwnerId(){
  if(!state || state.currentPick >= state.order.length) return null;
  return state.order[state.currentPick].ownerId;
}
function ownerName(id){ const idx = state.ownerIds.indexOf(id); return state.ownerNames[idx]; }
function ownerNameSafe(id){ const idx = state.ownerIds.indexOf(id); return idx>=0 ? state.ownerNames[idx] : id; }
function isDraftDone(){ return !state || state.currentPick >= state.order.length; }

function assignMlbAsset(roster, asset){
  const val = {name: asset.name, category: asset.category, teamAbrv: asset.teamAbrv || null};
  const tryHitterStarter = ()=>{
    for(let i=0;i<ROSTER_SPEC.mlbHitterStarters;i++){
      const k = "MLB_HITTER_"+i;
      if(roster[k] === null){ roster[k] = val; return true; }
    }
    return false;
  };
  const tryPitcherStarter = ()=>{
    for(let i=0;i<ROSTER_SPEC.mlbPitcherStarters;i++){
      const k = "MLB_PITCHER_"+i;
      if(roster[k] === null){ roster[k] = val; return true; }
    }
    return false;
  };
  const tryBench = ()=>{
    for(let i=0;i<ROSTER_SPEC.mlbBenchSlots;i++){
      const k = "MLB_BENCH_"+i;
      if(roster[k] === null){ roster[k] = val; return true; }
    }
    return false;
  };
  if(asset.category === "MLB_HITTER") return tryHitterStarter() || tryBench();
  if(asset.category === "MLB_PITCHER") return tryPitcherStarter() || tryBench();
  // MLB_FLEX (Ohtani-type): hitter slot first, then pitcher slot, then bench
  return tryHitterStarter() || tryPitcherStarter() || tryBench();
}

function emptyRoster(){
  const roster = {};
  ROSTER_SPEC.teamSports.forEach(s => roster["TEAM_"+s] = null);
  for(let i=0;i<ROSTER_SPEC.teamFlexSlots;i++) roster["TEAM_FLEX_"+i] = null;
  ROSTER_SPEC.playerSlots.forEach(sl => { roster[sl.key] = new Array(sl.count).fill(null); });
  for(let i=0;i<ROSTER_SPEC.mlbHitterStarters;i++) roster["MLB_HITTER_"+i] = null;
  for(let i=0;i<ROSTER_SPEC.mlbPitcherStarters;i++) roster["MLB_PITCHER_"+i] = null;
  for(let i=0;i<ROSTER_SPEC.mlbBenchSlots;i++) roster["MLB_BENCH_"+i] = null;
  return roster;
}
function cloneRoster(roster){
  const copy = {};
  Object.keys(roster).forEach(k=>{
    copy[k] = Array.isArray(roster[k]) ? roster[k].slice() : roster[k];
  });
  return copy;
}

// Tries to place one asset into a roster object (mutating it). Returns true if it found a slot,
// false if there's no room anywhere for it (starter or bench) — the single source of truth for
// both what the roster panel displays AND whether an asset is currently draftable for that owner.
function tryPlaceAssetInRoster(roster, asset){
  const val = {name: asset.name, category: asset.category, teamAbrv: asset.teamAbrv || null};
  if(asset.type === "team" && ROSTER_SPEC.teamSports.includes(asset.category)){
    const sport = asset.category;
    const reqKey = "TEAM_"+sport;
    if(roster[reqKey] === null){ roster[reqKey] = val; return true; }
    // No per-league cap anymore — any number of teams from one league is fine. Once that league's
    // required slot is filled, extras just need any open team-flex bench slot, same as any other league.
    for(let i=0;i<ROSTER_SPEC.teamFlexSlots;i++){
      const k = "TEAM_FLEX_"+i;
      if(roster[k] === null){ roster[k] = val; return true; }
    }
    return false;
  } else if(MLB_CATEGORIES.includes(asset.category)){
    return assignMlbAsset(roster, asset);
  } else {
    const key = asset.category;
    if(roster[key]){
      const idx = roster[key].indexOf(null);
      if(idx !== -1){ roster[key][idx] = val; return true; }
    }
    return false;
  }
}

function assignDisplayRoster(pickIds){
  const roster = emptyRoster();
  const extra = [];

  pickIds.forEach(id=>{
    const asset = state.pool.find(a=>a.id===id);
    if(!asset){ extra.push({name:id, category:null, teamAbrv:null}); return; }
    const placed = tryPlaceAssetInRoster(roster, asset);
    if(!placed){
      const label = asset.type === "team" ? " (extra team)" : (MLB_CATEGORIES.includes(asset.category) ? " (extra MLB)" : " (extra)");
      extra.push({name:asset.name+label, category:asset.category, teamAbrv: asset.teamAbrv || null});
    }
  });
  return {roster, extra};
}

// Dry-run check: would this asset currently have any open slot (starter or bench) on this owner's roster?
function canDraftAssetFor(ownerId, asset, baseRoster){
  const roster = baseRoster ? cloneRoster(baseRoster) : assignDisplayRoster(state.rosters[ownerId] || []).roster;
  return tryPlaceAssetInRoster(roster, asset);
}

// ---------- IDENTITY ----------
function identityLocked(){
  return !!(myIdentity && myIdentity.confirmed && state && myIdentity.draftId === state.draftId);
}

// Shared identity-picker logic — renders a select + confirm button into whatever container is passed,
// so both the compact topbar version and the full-page gate screen use identical wiring/behavior.
function renderIdentityPicker(container, idPrefix){
  const claimed = state.claims || {};
  const options = state.ownerIds.map((id,i)=>{
    const taken = claimed[id];
    return `<option value="${id}" ${taken?"disabled":""}>${state.ownerNames[i]}${taken?" (claimed)":""}</option>`;
  }).join("");
  const armed = identityArmed && identityArmed === pendingIdentityChoice;

  container.innerHTML = `
    <select id="${idPrefix}Select"><option value="">— who are you —</option>${options}</select>
    <button id="${idPrefix}ConfirmBtn" class="primary">${armed ? "Click again to lock in" : "Confirm"}</button>
    ${armed ? `<button id="${idPrefix}CancelBtn" class="ghost">Cancel</button>` : ""}
  `;
  const selEl = document.getElementById(idPrefix+"Select");
  if(pendingIdentityChoice) selEl.value = pendingIdentityChoice;
  selEl.onchange = ()=>{ pendingIdentityChoice = selEl.value; identityArmed = null; render(); };

  const cancelBtn = document.getElementById(idPrefix+"CancelBtn");
  if(cancelBtn) cancelBtn.onclick = ()=>{ identityArmed = null; render(); };

  document.getElementById(idPrefix+"ConfirmBtn").onclick = async ()=>{
    const sel = selEl.value;
    if(!sel){ showToast("Choose your name first.", true); return; }

    if(identityArmed !== sel){
      identityArmed = sel;
      render();
      return;
    }

    const latest = await loadState();
    if(!latest){ showToast("Couldn't reach the draft state — try again.", true); return; }
    state = latest;
    if(state.claims[sel]){
      showToast("That name was just claimed on another device. Pick again.", true);
      identityArmed = null; pendingIdentityChoice = "";
      render();
      return;
    }
    state.claims[sel] = true;
    await saveState(state);
    await saveIdentity({id: sel, confirmed: true, draftId: state.draftId});
    identityArmed = null;
    pendingIdentityChoice = "";
    render();
  };
}

function renderIdentityControl(){
  const box = document.getElementById("identityControl");
  if(!state){ box.innerHTML = ""; return; }

  if(identityLocked()){
    box.innerHTML = `Viewing as <span class="locked">${ownerNameSafe(myIdentity.id)} 🔒</span>`;
    return;
  }

  if(!adminModeActive){
    // Regular visitors pick their identity on the full-page gate screen instead -- keep the topbar clean.
    box.innerHTML = "";
    return;
  }

  // Admin mode bypasses the gate screen, but can still optionally claim an identity from here.
  renderIdentityPicker(box, "topbarIdentity");
}

// ---------- ADMIN ----------
function renderAdminControl(){
  const box = document.getElementById("adminControl");
  if(!box) return;

  let html = "";

  // --- Admin Mode toggle (available even before a draft exists, so the commissioner can unlock setup) ---
  if(adminModeActive){
    html += `<span class="admin-badge">Admin mode ON</span> <button id="adminOffBtn" class="ghost" style="font-size:12px;">Turn off</button>`;
  } else if(showAdminPwForm){
    html += `
      <input id="adminPw" type="password" placeholder="admin password" style="width:120px; font-size:12px; padding:5px 8px;">
      <button id="adminOnConfirmBtn" class="ghost" style="font-size:12px;">Enable</button>
      <button id="adminOnCancelBtn" class="ghost" style="font-size:12px;">Cancel</button>
    `;
  } else {
    html += `<button id="adminOnBtn" class="ghost" style="font-size:12px;">Admin mode</button>`;
  }

  // --- Restart (only meaningful once a draft actually exists) ---
  if(state){
    html += ` `;
    if(!showRestartForm){
      html += `<button id="restartBtn" class="ghost" style="font-size:12px;">Restart draft (admin)</button>`;
    } else {
      html += `
        <input id="restartPw" type="password" placeholder="admin password" style="width:130px; font-size:12px; padding:5px 8px;">
        <button id="restartConfirmBtn" class="ghost" style="font-size:12px; border-color:#c25b4a; color:#c25b4a;">Wipe everything &amp; restart</button>
        <button id="restartCancelBtn" class="ghost" style="font-size:12px;">Cancel</button>
      `;
    }
  } else {
    showRestartForm = false; restartPwValue = "";
  }

  box.innerHTML = html;

  // --- wire admin mode ---
  if(adminModeActive){
    document.getElementById("adminOffBtn").onclick = async ()=>{
      await saveAdminMode(false);
      showToast("Admin mode off.");
      render();
    };
  } else if(showAdminPwForm){
    const pwEl = document.getElementById("adminPw");
    pwEl.value = adminPwValue;
    pwEl.oninput = ()=>{ adminPwValue = pwEl.value; };
    pwEl.onkeydown = (e)=>{ if(e.key === "Enter") document.getElementById("adminOnConfirmBtn").click(); };
    document.getElementById("adminOnCancelBtn").onclick = ()=>{ showAdminPwForm = false; adminPwValue = ""; renderAdminControl(); };
    document.getElementById("adminOnConfirmBtn").onclick = async ()=>{
      if(pwEl.value !== ADMIN_PASSWORD){ showToast("Incorrect password.", true); return; }
      showAdminPwForm = false; adminPwValue = "";
      await saveAdminMode(true);
      showToast("Admin mode on — you can draft on behalf of whoever's on the clock.");
      render();
    };
  } else {
    document.getElementById("adminOnBtn").onclick = ()=>{ showAdminPwForm = true; renderAdminControl(); };
  }

  // --- wire restart (only exists in the DOM once a draft is active) ---
  if(!state) return;
  if(!showRestartForm){
    document.getElementById("restartBtn").onclick = ()=>{ showRestartForm = true; renderAdminControl(); };
    return;
  }
  const pwInput = document.getElementById("restartPw");
  pwInput.value = restartPwValue;
  pwInput.oninput = ()=>{ restartPwValue = pwInput.value; };
  pwInput.onkeydown = (e)=>{ if(e.key === "Enter") document.getElementById("restartConfirmBtn").click(); };

  document.getElementById("restartCancelBtn").onclick = ()=>{
    showRestartForm = false; restartPwValue = "";
    renderAdminControl();
  };

  document.getElementById("restartConfirmBtn").onclick = async ()=>{
    if(pwInput.value !== ADMIN_PASSWORD){ showToast("Incorrect password.", true); return; }
    try{
      await window.storage.set(SETUP_KEY, JSON.stringify(null), true);
    }catch(e){
      showToast("Restart failed to save ("+e.message+"). Try again.", true);
      return;
    }
    state = null;
    pendingIdentityChoice = "";
    rosterViewOwnerId = null;
    identityArmed = null;
    showRestartForm = false;
    restartPwValue = "";
    showToast("Draft restarted — back to setup.");
    render();
  };
}

// ---------- DRAFT VIEW ----------
function renderDraft(){
  document.getElementById("setupArea").style.display = "none";
  const el = document.getElementById("draftArea");
  el.style.display = "block";

  const draftDone = isDraftDone();
  const onClockId = currentOwnerId();
  const myId = identityLocked() ? myIdentity.id : null;
  const isMyOwnTurn = !draftDone && onClockId === myId;
  const isAdminOverride = !draftDone && adminModeActive && !isMyOwnTurn;
  const myTurn = isMyOwnTurn || isAdminOverride;
  const totalRounds = state.order.length ? state.order[state.order.length-1].round : 0;
  if(!rosterViewOwnerId || !state.ownerIds.includes(rosterViewOwnerId)){
    rosterViewOwnerId = myId || onClockId || state.ownerIds[0];
  }
  const viewingOwnerId = rosterViewOwnerId;

  document.getElementById("titleLine").textContent = draftDone
    ? "Draft complete"
    : `Round ${state.order[state.currentPick].round} of ${totalRounds} · Pick ${state.currentPick+1} of ${state.order.length}`;

  let html = "";
  if(draftDone){
    html += `<div class="card"><h2>Result</h2><p class="hint">All picks are in — the board and roster panel below are the full record. Export a backup any time from the button below.</p></div>`;
  }

  let poolHeading = "Available pool";
  if(isMyOwnTurn) poolHeading = "Make your pick";
  else if(isAdminOverride) poolHeading = `Make pick for ${ownerName(onClockId)} <span class="admin-badge" style="margin-left:6px;">Admin</span>`;

  html += `<div class="flexwrap">
    <div class="col"><div class="card" id="poolCard">
      <h2>${poolHeading}</h2>
      <input class="pool-search" id="poolSearch" placeholder="Search by name, sport, or category...">
      <div class="pool-sort">
        <span class="filter-label">Sort by</span>
        <select id="poolSortSelect">
          <option value="adp">ADP</option>
          <option value="proj">Projected Points</option>
          <option value="rank">Position Rank</option>
          <option value="lastseason">Last Season</option>
          <option value="name">Name (A–Z)</option>
        </select>
      </div>
      <div class="pool-list" id="poolList"></div>
    </div></div>
    <div class="col roster-col"><div class="card" id="rosterCard">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <h2 style="margin:0;">Roster</h2>
        <select id="rosterOwnerSelect"></select>
      </div>
      <div id="rosterPanel"></div>
    </div></div>
  </div>`;

  html += `<div class="card"><h2>Draft board</h2><div class="board" id="boardWrap"></div></div>`;
  html += `<div class="row" style="margin-bottom:16px;"><button id="exportBtn" class="ghost">Export backup (JSON)</button></div>`;
  html += `<div class="card"><h2>Pick log</h2><div class="log" id="logWrap"></div></div>`;

  const existingPoolList = document.getElementById("poolList");
  if(existingPoolList) poolScrollTop = existingPoolList.scrollTop;
  const existingSearch = document.getElementById("poolSearch");
  if(existingSearch) poolSearchValue = existingSearch.value;

  el.innerHTML = html;

  const rosterSelect = document.getElementById("rosterOwnerSelect");
  state.ownerIds.forEach((id,i)=>{
    const opt = document.createElement("option");
    opt.value = id; opt.textContent = state.ownerNames[i];
    if(id === viewingOwnerId) opt.selected = true;
    rosterSelect.appendChild(opt);
  });
  rosterSelect.onchange = ()=>{ rosterViewOwnerId = rosterSelect.value; renderRosterPanel(rosterViewOwnerId); };

  renderPool(myTurn);
  renderRosterPanel(viewingOwnerId);
  renderBoard();
  renderLog();
  document.getElementById("exportBtn").onclick = exportBackup;

  // Pin the pool card's height to the roster card's natural height — roster stays exactly as tall as its content.
  const poolCard = document.getElementById("poolCard");
  const rosterCard = document.getElementById("rosterCard");
  if(poolCard && rosterCard){
    poolCard.style.height = "";
    const targetH = rosterCard.getBoundingClientRect().height;
    poolCard.style.height = targetH + "px";
  }
}

function renderPool(myTurn){
  const listEl = document.getElementById("poolList");
  const searchEl = document.getElementById("poolSearch");
  searchEl.value = poolSearchValue;
  const sortEl = document.getElementById("poolSortSelect");
  sortEl.value = poolSortBy;

  function draw(){
    const q = searchEl.value.trim().toLowerCase();
    const sortKey = sortEl.value;
    const avail = state.pool.filter(a=>!a.drafted)
      .filter(a=> !q || a.name.toLowerCase().includes(q) || a.category.toLowerCase().includes(q) || a.type.includes(q))
      .sort((a,b)=> {
        if(sortKey === "name") return a.name.localeCompare(b.name);
        if(sortKey === "proj"){
          const av = (a.projectedPoints !== null && a.projectedPoints !== undefined) ? a.projectedPoints : -Infinity;
          const bv = (b.projectedPoints !== null && b.projectedPoints !== undefined) ? b.projectedPoints : -Infinity;
          if(av !== bv) return bv - av; // higher projection first
          return a.name.localeCompare(b.name);
        }
        if(sortKey === "rank"){
          const av = (a.rank !== null && a.rank !== undefined) ? a.rank : Infinity;
          const bv = (b.rank !== null && b.rank !== undefined) ? b.rank : Infinity;
          if(av !== bv) return av - bv;
          return a.name.localeCompare(b.name);
        }
        if(sortKey === "lastseason"){
          const av = (a.lastSeasonPoints !== null && a.lastSeasonPoints !== undefined) ? a.lastSeasonPoints : -Infinity;
          const bv = (b.lastSeasonPoints !== null && b.lastSeasonPoints !== undefined) ? b.lastSeasonPoints : -Infinity;
          if(av !== bv) return bv - av; // higher last-season points first
          return a.name.localeCompare(b.name);
        }
        // default: adp
        const aAdp = (a.adp !== null && a.adp !== undefined) ? a.adp : Infinity;
        const bAdp = (b.adp !== null && b.adp !== undefined) ? b.adp : Infinity;
        if(aAdp !== bAdp) return aAdp - bAdp;
        return (a.rank||9999) - (b.rank||9999);
      });
    listEl.innerHTML = "";
    if(avail.length === 0){ listEl.innerHTML = `<div class="empty">No matching assets left.</div>`; return; }
    const onClockId = currentOwnerId();
    const baseRoster = (myTurn && onClockId) ? assignDisplayRoster(state.rosters[onClockId] || []).roster : null;
    avail.slice(0,300).forEach(a=>{
      const row = document.createElement("div");
      row.className = "pool-item";
      const c = leagueColor(a.category);
      const expanded = poolExpandedIds.has(a.id);
      const draftable = baseRoster ? canDraftAssetFor(onClockId, a, baseRoster) : false;
      let draftBtn = "";
      if(myTurn){
        draftBtn = draftable
          ? `<button data-pick="${a.id}">Draft</button>`
          : `<button disabled title="No open roster slot for this position right now">Full</button>`;
      }
      const adpDisplay = (a.adp !== null && a.adp !== undefined) ? a.adp.toFixed(1) : "—";
      const projDisplay = fmtStat(a.projectedPoints) !== null ? fmtStat(a.projectedPoints) : "—";
      row.innerHTML = `
        <div class="pool-item-row">
          <div class="pool-item-info" data-toggle="${a.id}">
            <span class="expand-arrow">${expanded ? "▾" : "▸"}</span>
            <div>
              <div>${a.name} <span class="tag" style="background:${c}26; color:${c}; border:1px solid ${c}77;">${prettyCategory(a.category)}</span></div>
              <div class="meta">${a.type}${a.teamAbrv ? " · "+a.teamAbrv : ""}</div>
            </div>
          </div>
          <div class="pool-item-stats">ADP <b>${adpDisplay}</b></div>
          ${draftBtn}
        </div>
        ${expanded ? `
          <div class="pool-item-detail" style="border-left:3px solid ${c};">
            <div class="detail-row"><span class="detail-label">Position Rank</span><span class="detail-value">${a.rank !== null && a.rank !== undefined ? a.rank : "—"}</span></div>
            <div class="detail-row"><span class="detail-label">Projected Points</span><span class="detail-value">${projDisplay}</span></div>
            <div class="detail-row"><span class="detail-label">Last Season</span><span class="detail-value">${fmtStat(a.lastSeasonPoints) !== null ? fmtStat(a.lastSeasonPoints) : "—"}</span></div>
          </div>` : ""}
      `;
      listEl.appendChild(row);
    });
  }
  draw();
  listEl.scrollTop = poolScrollTop;
  searchEl.oninput = ()=>{ poolSearchValue = searchEl.value; poolScrollTop = 0; draw(); };
  sortEl.onchange = ()=>{ poolSortBy = sortEl.value; poolScrollTop = 0; draw(); };
  listEl.onclick = async (e)=>{
    const pickId = e.target.dataset.pick;
    if(pickId){ e.target.disabled = true; await submitPick(pickId); return; }
    const toggle = e.target.closest("[data-toggle]");
    if(toggle){
      const id = toggle.dataset.toggle;
      if(poolExpandedIds.has(id)) poolExpandedIds.delete(id); else poolExpandedIds.add(id);
      poolScrollTop = listEl.scrollTop;
      draw();
      listEl.scrollTop = poolScrollTop;
    }
  };
}

function slotRowHtml(label, val){
  const filled = !!val;
  const content = filled ? nameWithTeam(val.name, val.teamAbrv) : "—";
  const style = filled ? ` style="border-left-color:${leagueColor(val.category)};"` : "";
  return `<div class="slot-row ${filled?"filled":"open"}"${style}><span class="label">${label}</span><span>${content}</span></div>`;
}

function renderRosterPanel(ownerId){
  const box = document.getElementById("rosterPanel");
  if(!box) return;
  const {roster, extra} = assignDisplayRoster(state.rosters[ownerId] || []);

  // ---- Column 1, Teams: starters = 8 required sport slots, bench = 4 team flex ----
  let teamsHtml = `<h3>Teams</h3>`;
  teamsHtml += `<div class="slot-group"><div class="slot-group-title">Starters</div>`;
  ROSTER_SPEC.teamSports.forEach(s=>{
    teamsHtml += slotRowHtml(s, roster["TEAM_"+s]);
  });
  teamsHtml += `</div>`;
  teamsHtml += `<div class="slot-group"><div class="slot-group-title">Bench / Flex</div>`;
  for(let i=0;i<ROSTER_SPEC.teamFlexSlots;i++){
    teamsHtml += slotRowHtml("FLEX", roster["TEAM_FLEX_"+i]);
  }
  teamsHtml += `</div>`;

  // ---- Column 2, Player Starters: 1 of each 2-slot position, plus MLB's 2 Hitter + 1 Pitcher ----
  let startersHtml = `<h3>Players</h3><div class="slot-group"><div class="slot-group-title">Starters</div>`;
  ROSTER_SPEC.playerSlots.forEach(sl=>{
    startersHtml += slotRowHtml(sl.label, roster[sl.key][0]);
  });
  for(let i=0;i<ROSTER_SPEC.mlbHitterStarters;i++) startersHtml += slotRowHtml("MLB Hitter", roster["MLB_HITTER_"+i]);
  for(let i=0;i<ROSTER_SPEC.mlbPitcherStarters;i++) startersHtml += slotRowHtml("MLB Pitcher", roster["MLB_PITCHER_"+i]);
  startersHtml += `</div>`;

  // ---- Column 3, Player Bench: the backup copy of each 2-slot position, plus the 2 generic MLB bench spots ----
  let benchHtml = `<h3>Players</h3><div class="slot-group"><div class="slot-group-title">Bench / Flex</div>`;
  ROSTER_SPEC.playerSlots.forEach(sl=>{
    for(let i=1;i<sl.count;i++){
      benchHtml += slotRowHtml(sl.label, roster[sl.key][i]);
    }
  });
  for(let i=0;i<ROSTER_SPEC.mlbBenchSlots;i++) benchHtml += slotRowHtml("MLB Bench", roster["MLB_BENCH_"+i]);
  benchHtml += `</div>`;

  let html = `<div class="roster-columns">
    <div>${teamsHtml}</div>
    <div>${startersHtml}</div>
    <div>${benchHtml}</div>
  </div>`;

  if(extra.length){
    html += `<div class="slot-group" style="margin-top:8px;"><div class="slot-group-title">Extra (didn't match a labeled slot)</div>
      <div class="extra-list">${extra.map(e=>leagueDot(e.category)+nameWithTeam(e.name, e.teamAbrv)).join("<br>")}</div></div>`;
  }
  box.innerHTML = html;
}

function renderBoard(){
  const wrap = document.getElementById("boardWrap");
  const totalRounds = state.order.length ? state.order[state.order.length-1].round : 0;
  let html = "<table><thead><tr><th>Rd</th>";
  state.ownerIds.forEach(id=> html += `<th>${ownerName(id)}</th>`);
  html += "</tr></thead><tbody>";
  const byRoundOwner = {};
  state.log.forEach(entry=>{ byRoundOwner[entry.round+"_"+entry.ownerId] = entry; });
  for(let r=1; r<=totalRounds; r++){
    html += `<tr><td class="rd">${r}</td>`;
    state.ownerIds.forEach(id=>{
      const isOnClock = !isDraftDone() && state.order[state.currentPick].round === r && state.order[state.currentPick].ownerId === id;
      const entry = byRoundOwner[r+"_"+id];
      const cls = (entry ? "filled" : "") + (isOnClock ? " onclock-cell" : "");
      let style = "";
      if(entry){
        const c = leagueColor(entry.category);
        style = ` style="background-color:${c}4d; border-color:${c}99;"`;
      }
      let cellContent = "";
      if(entry){
        let sub = "";
        if(entry.assetType === "player"){
          sub = entry.team || ((entry.category === "GOLF" || entry.category === "TENNIS") ? prettyCategory(entry.category) : "");
        } else {
          sub = prettyCategory(entry.category);
        }
        cellContent = `<div>${entry.assetName}</div>${sub ? `<div class="board-sub">${sub}</div>` : ""}`;
      }
      html += `<td class="${cls}"${style}>${cellContent}</td>`;
    });
    html += "</tr>";
  }
  html += "</tbody></table>";
  wrap.innerHTML = html;
}

function renderLog(){
  const wrap = document.getElementById("logWrap");
  if(state.log.length === 0){ wrap.innerHTML = `<div class="empty">No picks yet.</div>`; return; }
  wrap.innerHTML = state.log.slice().reverse().slice(0,50).map(e=>
    `<div>#${e.pickNumber} · Rd ${e.round} · ${ownerNameSafe(e.ownerId)} → ${leagueDot(e.category)}${nameWithTeam(e.assetName, e.teamAbrv)}${e.auto?" (auto)":""}</div>`
  ).join("");
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "fantasy365_draft_backup_"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function submitPick(assetId, auto){
  const latest = await loadState();
  if(!latest) return;
  state = latest;
  if(isDraftDone()) { render(); return; }
  const onClockId = currentOwnerId();
  const asset = state.pool.find(a=>a.id === assetId);
  if(!asset || asset.drafted){ showToast("That one was just taken — pick again.", true); render(); return; }
  if(!canDraftAssetFor(onClockId, asset)){
    showToast("No open roster slot for that position right now.", true);
    render();
    return;
  }
  asset.drafted = true;
  state.rosters[onClockId].push(asset.id);
  state.log.push({
    pickNumber: state.currentPick+1, round: state.order[state.currentPick].round,
    ownerId: onClockId, assetId: asset.id, assetName: asset.name, category: asset.category,
    assetType: asset.type, team: asset.team || null, teamAbrv: asset.teamAbrv || null, auto: !!auto
  });
  state.currentPick += 1;
  await saveState(state);
  render();
}

async function refreshFromStorage(){
  const latest = await loadState();
  const latestJSON = JSON.stringify(latest); // JSON.stringify(null) === "null", so this also covers the "no draft" state
  if(latestJSON === lastStateJSON) return;   // nothing actually changed — skip the render, DOM stays untouched
  lastStateJSON = latestJSON;
  state = latest;
  render();
}

function render(){
  renderIdentityControl();
  renderAdminControl();
  renderOnClockBar();
  if(!state){
    if(adminModeActive) renderSetup();
    else renderWaitingScreen();
  } else if(!identityLocked() && !adminModeActive){
    renderIdentityGateScreen();
  } else {
    renderDraft();
  }
}

function renderWaitingScreen(){
  document.getElementById("draftArea").style.display = "none";
  const el = document.getElementById("setupArea");
  el.style.display = "block";
  el.innerHTML = `
    <div class="card gate-card">
      <h2 style="margin-bottom:6px;">Waiting on the commissioner</h2>
      <p class="hint">The draft hasn't been set up yet. Check back once it's been started — this page will update on its own.</p>
    </div>
  `;
}

function renderIdentityGateScreen(){
  document.getElementById("draftArea").style.display = "none";
  const el = document.getElementById("setupArea");
  el.style.display = "block";
  el.innerHTML = `
    <div class="card gate-card">
      <h2 style="margin-bottom:6px;">Who are you?</h2>
      <p class="hint">Pick your name to join the draft. This locks in for you on this device — make sure it's really you.</p>
      <div class="row" id="gateIdentityContainer" style="margin-top:10px;"></div>
    </div>
  `;
  renderIdentityPicker(document.getElementById("gateIdentityContainer"), "gateIdentity");
}

function renderOnClockBar(){
  const box = document.getElementById("onClockBar");
  if(!box) return;
  if(!state || isDraftDone()){ box.innerHTML = ""; return; }
  const onClockId = currentOwnerId();
  box.innerHTML = `
    <div>
      <div class="oc-label">On the clock</div>
      <div class="oc-name">${ownerName(onClockId)}</div>
    </div>
    <div class="oc-meta">${state.rosters[onClockId].length} drafted</div>
  `;
}

async function init(){
  state = await loadState();
  lastStateJSON = JSON.stringify(state);
  myIdentity = await loadIdentity();
  adminModeActive = await loadAdminMode();
  render();
  setInterval(refreshFromStorage, 4000);
}
init();
</script>
